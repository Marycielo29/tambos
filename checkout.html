<script>
let carrito = [];
let cliente = null;
let metodoPago = 'contra_entrega';

// Cargar datos al iniciar
document.addEventListener('DOMContentLoaded', async function() {
    // Primero verificar que tenga productos en el carrito
    cargarCarrito();
    
    if (carrito.length === 0) {
        // Si el carrito está vacío, mostrar mensaje
        document.getElementById('carritoVacio').style.display = 'block';
        document.getElementById('checkoutContenido').style.display = 'none';
        return;
    }
    
    // Verificar sesión ANTES de mostrar contenido
    const estaLogueado = await verificarSesion();
    
    if (!estaLogueado) {
        // Si no está logueado, NO mostrar checkout, redirigir a login
        mostrarMensajeLoginRequerido();
        return;
    }
    
    // Si está logueado y tiene productos, mostrar checkout
    cargarDatosCliente();
    calcularTotales();
});

// Función para mostrar mensaje de login requerido
<!-- Reemplaza la función mostrarMensajeLoginRequerido() con esto: -->

                            <span>S/ ${envio.toFixed(2)}</span>
                        </div>
                        <div class="d-flex justify-content-between fw-bold fs-5 mt-2">
                            <span>Total a pagar:</span>
                            <span class="text-primary">S/ ${total.toFixed(2)}</span>

                    </div>

                <div class="alert alert-info">
                    <div class="d-flex">

// Mostrar resumen de productos en el carrito
function mostrarResumenCarrito() {
    const contenedor = document.getElementById('resumenCarrito');
    
    if (carrito.length === 0) return;
    
    let html = '<div class="list-group">';
    let subtotal = 0;
    
    carrito.forEach(producto => {
        const cantidad = producto.cantidad || 1;
        const precioTotal = producto.precio * cantidad;
        subtotal += precioTotal;
        
        html += `
            <div class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-1">${producto.nombre}</h6>
                        <small class="text-muted">${cantidad} x S/ ${producto.precio.toFixed(2)}</small>
                    </div>
                    <span class="fw-bold">S/ ${precioTotal.toFixed(2)}</span>
                </div>
            </div>
        `;
    });
    
    const total = subtotal + 10; // + envío
    
    html += `
        <div class="list-group-item bg-light">
            <div class="d-flex justify-content-between">
                <span>Subtotal:</span>
                <span>S/ ${subtotal.toFixed(2)}</span>
            </div>
            <div class="d-flex justify-content-between">
                <span>Envío:</span>
                <span>S/ 10.00</span>
            </div>
            <hr class="my-2">
            <div class="d-flex justify-content-between fw-bold">
                <span>Total:</span>
                <span>S/ ${total.toFixed(2)}</span>
            </div>
        </div>
    `;
    
    contenedor.innerHTML = html;
}

// Verificar que el usuario esté logueado
async function verificarSesion() {
    try {
        const response = await fetch('verificar_sesion.php');
        const data = await response.json();
        
        if (data.logged_in) {
            cliente = data.cliente;
            return true;
        }
        return false;
    } catch (error) {
        console.error('Error al verificar sesión:', error);
        return false;
    }
}
