<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Licorería Tambos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #8B0000;
            --color-dark: #000000;
        }
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding-top: 80px;
        }
        .registro-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .registro-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(139, 0, 0, 0.15);
            overflow: hidden;
        }
        .registro-header {
            background: linear-gradient(135deg, var(--color-primary), #000000);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .registro-header h2 {
            font-weight: bold;
            margin: 15px 0 10px;
        }
        .registro-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 0.2rem rgba(139, 0, 0, 0.25);
        }
        .btn-tambos {
            background: linear-gradient(135deg, var(--color-primary), #a00000);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-tambos:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.3);
        }
        .nav-link {
            color: white !important;
        }
        @media (max-width: 768px) {
            .registro-body { padding: 20px; }
            body { padding-top: 60px; }
        }
    </style>
</head>
<body>
    <!-- NAVBAR (copia exactamente el de tu index.html aquí) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: linear-gradient(135deg, var(--color-primary), #000000);">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-wine-bottle"></i> TAMBOS
            </a>
            <div class="d-flex">
                <a href="login.html" class="btn btn-outline-light btn-sm me-2">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </a>
                <a href="index.html" class="btn btn-light btn-sm">
                    <i class="fas fa-home"></i> Inicio
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="registro-container">
            <div class="registro-card">
                <div class="registro-header">
                    <div class="logo-registro">
                        <i class="fas fa-wine-bottle fa-3x"></i>
                    </div>
                    <h2>Crear Cuenta en Tambos</h2>
                    <p>Regístrate para realizar tus pedidos</p>
                </div>
                
                <div class="registro-body">
                    <form id="registroForm">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Nombre Completo *</label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" name="telefono">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirmar Contraseña *</label>
                                <input type="password" class="form-control" name="confirm_password" required>
                            </div>
                            
                            <div class="col-12 mb-3">
                                <label class="form-label">Dirección de Entrega</label>
                                <textarea class="form-control" name="direccion" rows="3"></textarea>
                            </div>
                            
                            <div class="col-12 mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terminos" required>
                                    <label class="form-check-label" for="terminos">
                                        Acepto los <a href="terminos.html" style="color: var(--color-primary);">Términos y Condiciones</a>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="col-12">
                                <button type="submit" class="btn-tambos">
                                    <i class="fas fa-user-plus me-2"></i> Crear Cuenta
                                </button>
                            </div>
                            
                            <div class="col-12 mt-4 text-center">
                                <p>¿Ya tienes cuenta? 
                                    <a href="login.html" style="color: var(--color-primary); font-weight: bold;">
                                        Inicia Sesión aquí
                                    </a>
                                </p>
                            </div>
                        </div>
                    </form>
                    
                    <div id="mensajeRegistro" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const mensajeDiv = document.getElementById('mensajeRegistro');
            
            // Validación de contraseñas
            if (formData.get('password') !== formData.get('confirm_password')) {
                mostrarMensaje('Las contraseñas no coinciden', 'danger');
                return;
            }
            
            // Enviar al servidor
            try {
                const response = await fetch('registrar.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    mostrarMensaje('✅ ' + data.message, 'success');
                    
                    // Redirigir después de 2 segundos
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect');
                        window.location.href = redirect ? redirect : 'index.html';
                    }, 2000);
                } else {
                    mostrarMensaje('❌ ' + data.message, 'danger');
                }
            } catch (error) {
                mostrarMensaje('❌ Error de conexión con el servidor', 'danger');
            }
        });
        
        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('mensajeRegistro');
            div.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                    ${texto}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }
        
        // Verificar si ya está logueado
        async function verificarSesion() {
            try {
                const response = await fetch('verificar_sesion.php');
                const data = await response.json();
                
                if (data.logged_in) {
                    // Si ya está logueado, redirigir al inicio
                    window.location.href = 'index.html';
                }
            } catch (error) {
                // Si hay error, continuar con el registro
            }
        }
        
        // Ejecutar al cargar la página
        verificarSesion();
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
